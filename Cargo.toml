[workspace]
members = ["crates/benitoiteh"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
version = "0.0.1"

# Benitoite v0.0.6 (f31dacd3bddadfb692abd0b2ea31002128f64c4f) の項目に揃える。
# 試作では unsafe を例外なく禁じる（設計書 06-01「lint と実装の規約」）。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
let_underscore_must_use = "deny"
clone_on_ref_ptr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
