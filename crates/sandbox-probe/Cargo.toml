[package]
name = "sandbox-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
signal-hook = { version = "=0.4.5", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process", "stdio"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["mount"] }
